plugins {
    // Adds Java compilation along with testing and bundling capabilities to a project.
    id 'java'
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

group = 'subgrup-prop13-3'
version = '1.0'

ext {
    javaMainClass = 'presentation.Main'
}

application {
    // Define the main class for the application.
    mainClass = javaMainClass
}

jar {
    destinationDirectory = file("$projectDir.parentFile/EXE/")
    archiveBaseName = "form-builder"
    archiveVersion = "" // removes version suffix
    // archiveClassifier

    manifest {
        attributes 'Main-Class': javaMainClass
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // to build a fat JAR (a single runnable JAR with everything inside, bundling all dependencies)
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// tasks.withType(JavaCompile) {
//     options.compilerArgs += ["-Xlint:unchecked"]
//     options.compilerArgs += ["-Xlint:deprecation"]
// }

javadoc {
    destinationDir = file("${projectDir.parentFile}/DOCS/javadoc/")

    options {
        title = "Forms: Subgrup-prop13"
        windowTitle = "Forms: Subgrup-prop13"
        addStringOption('header', 'Forms - Subgrup 13')

        author = true // set author tag
        version = true // set version tag

        addBooleanOption('private', true)
        addBooleanOption('protected', true)

        // disable doclint warnings 
        addStringOption('Xdoclint:none', '-quiet')

        // add links to external javadoc
        addStringOption('link', 'https://docs.oracle.com/javase/21/docs/api/')
    }
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'uk.org.webcompere:system-stubs-junit4:2.1.8'
    testImplementation "org.mockito:mockito-core:5.21.0"

    implementation 'com.google.code.gson:gson:2.13.2-rc1'
    implementation 'com.google.code.gson:gson-extras:2.13.2-rc1'
}
